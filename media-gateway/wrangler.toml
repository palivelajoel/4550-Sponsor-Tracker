name = "media-gateway"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# R2 bucket holding all large media (Media Gallery videos, CAD, etc.)
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "4550-media"

# Secret (set in dashboard or `wrangler secret put`): JWT_SECRET
# Must be the SAME value as the JWT_SECRET env var used by the Vercel backend,
# so this worker can verify the HS256 JWTs the site issues to members/admins.